<div class="card border-0">
<div class="card-body">
<h5 class="card-title mb-3">News</h5>

{% for article in site.data.news limit:9 %}
<div class="mb-3 pb-3 border-bottom">
  <div class="small text-muted">{{ article.date }}</div>
  <p class="mb-0">{{ article.headline }}</p>
</div>
{% endfor %}

<a href="{{ site.url }}{{ site.baseurl }}/allnews.html" class="fw-semibold">See all news &rarr;</a>

</div>
</div>
