<div class="col">
<div class="card h-100 border-0 card-hover software-card">
<img src="{{ site.url }}{{ site.baseurl }}/images/softwarepic/{{ include.software.logo }}" class="card-img-top software-card-logo" alt="{{ include.software.name }} logo">
<div class="card-body d-flex flex-column">
<h5 class="card-title mb-2 visually-hidden">{{ include.software.name }}</h5>
<div class="software-langs mb-2">
{% for lang in include.software.languages %}<span class="software-lang-badge">{{ lang }}</span>{% endfor %}
</div>
<p class="small text-muted mb-0">{{ include.software.description }}</p>
<div class="mt-auto pt-3"><a href="{{ include.software.github }}" title="GitHub"><i class="fa-brands fa-github"></i> GitHub</a></div>
</div>
</div>
</div>
