- title: Statistical comparisons of time-series feature sets on classification tasks
  image: Henderson2026.png
  description: "Dozens of open-source libraries offer different sets of time-series features for classification, but it's been unclear whether any one is actually better than the rest. By rigorously comparing six major feature sets and simple baselines across 124 real-world classification problems, this study found that most perform statistically indistinguishably from one another. This gives practitioners confidence that smaller, interpretable feature sets are often just as effective as larger, more complex ones."
  authors: T. Henderson, B.D. Fulcher
  link:
    url: https://arxiv.org/abs/2608.01586
    journal: arXiv
    year: 2026
  highlight: 1
  news2:
  video:

- title: Parameter inference from a non-stationary unknown process
  image: Owens2024.png
  description: "Real-world systems like the climate often change their behaviour over time in ways we want to quantify, but doing so usually requires knowing the underlying mathematical model, which is rarely available. This paper reviews and unifies the fragmented literature on parameter inference from a non-stationary unknown process, organizing existing model-free methods into six families and testing them on common benchmarks. The analysis shows that widely used benchmark systems are too easy for simple statistical features to solve, exposing a gap and pointing to genuinely challenging test cases that should guide future method development."
  authors: K. Owens, B.D. Fulcher
  link:
    url: https://doi.org/10.1063/5.0228236
    journal: Chaos
    year: 2024
  highlight: 1
  news2:
  video:

- title: "_pyhctsa_: A Python package for highly comparative time-series analysis"
  image: Moore2026.png
  description: "Highly comparative time-series analysis, computing thousands of features to characterize dynamics, has so far only been available through a closed, licensed MATLAB toolbox, locking many researchers out. pyhctsa reimplements this framework as an open-source Python package, letting users compute thousands of interpretable time-series features and compare them systematically. This opens highly comparative time-series analysis to Python's much larger open-source scientific community, making feature-based dynamical characterization far more accessible."
  authors: J.B. Moore, B.D. Fulcher
  link:
    url: https://doi.org/10.21105/joss.10581
    journal: Journal of Open Source Software
    year: 2026
  highlight: 1
  news2:
  video:

- title: Unifying concepts in information-theoretic time-series analysis
  image: Bryant2026.png
  description: "Information theory offers powerful tools for quantifying complexity and structure in time series, but the field has splintered into domain-specific jargon, inconsistent notation, and clashing visual conventions. This paper unifies these information-theoretic measures under shared definitions, standardized notation, and consistent visualizations, illustrated with an fMRI brain-dynamics case study. The result is a common reference that should make these methods easier to compare, teach, and adopt across neuroscience and other complex-systems fields."
  authors: A.G. Bryant, O.M. Cliff, J.M. Shine, B.D. Fulcher, J.T. Lizier
  link:
    url: https://doi.org/10.1098/rsif.2025.0969
    journal: Journal of the Royal Society Interface
    year: 2026
  highlight: 1
  news2:
  video:

- title: "Synchrony, oscillations, and phase relationships in collective neuronal activity: a highly comparative overview of methods"
  image: Baroni2025.png
  description: "Neuroscientists have many ways to measure synchrony, oscillations, and phase relationships in neural population activity, but it is rarely clear which measure to trust, since most are sensitive to confounds like firing rate. By systematically applying 131 such measures to both synthetic data and real spike-train recordings from rat, mouse, and monkey, the authors mapped out how these measures relate to each other and to confounding factors. This comparative atlas gives researchers practical guidance for choosing appropriate measures, and shows the approach can reliably distinguish brain states such as wake from sleep."
  authors: F. Baroni, B.D. Fulcher
  link:
    url: https://doi.org/10.1371/journal.pcbi.1013597
    journal: PLOS Computational Biology
    year: 2025
  highlight: 0
  news2:
  video:

- title: Identifying statistical indicators of temporal asymmetry using a data-driven approach
  image: DalleNogarePRR2025.png
  description: "Many real-world processes are irreversible in time, but methods for detecting this time-irreversibility developed in fragmented, unconnected pockets of the literature, leaving it unclear which actually work. This study benchmarked over 6000 time-series statistics against 35 simulated systems to see which best distinguish irreversible from reversible dynamics. The results identify several effective families of methods, but show no single statistic works everywhere, giving researchers a practical, system-aware toolkit for connecting observed asymmetry to underlying mechanisms."
  authors: T. Dalle Nogare, B.D. Fulcher
  link:
    url: https://link.aps.org/doi/10.1103/4nb2-398s
    journal: Physical Review Research
    year: 2025
  highlight: 1
  news2:
  video: https://youtu.be/ctutRQgaixg

- title: A feature-based information-theoretic approach for detecting interpretable, long-timescale pairwise interactions from time series
  image: Nguyen2025.png
  description: "Traditional tools like correlation or Granger causality struggle to detect relationships between time series that unfold through their statistical properties over long timescales, especially in short, noisy data. This paper introduces a feature-based information-theoretic method that scans sliding windows of a source signal to find which of its properties mediate an influence on a target signal. Tested on simulated systems, the approach outperforms traditional methods in exactly the hard cases, short and noisy series with long interaction timescales, offering a new tool for neuroscience, finance, climate science, and engineering."
  authors: A. Nguyen, O. McMullin, J.T. Lizier, B.D. Fulcher
  link:
    url: https://doi.org/10.1103/qnx2-yp4c
    journal: Physical Review Research
    year: 2025
  highlight: 1
  news2:
  video:

- title: Benchmarking overlapping community detection methods for applications in human connectomics
  image: Bryant2025.png
  description: "Brain regions often participate in multiple functional communities at once, but standard community-detection algorithms force each region into just one, and there has been no principled way to choose among the many algorithms built to capture this overlap. The authors introduce a data-driven procedure that selects the best-performing overlapping community detection algorithm and its parameters by testing 22 candidates against a tailored ensemble of benchmark networks with known ground truth. Applied to the human structural connectome, the winning method reveals a seven-network decomposition of the cortex, giving connectomics researchers a principled way to choose community-detection tools for their own data."
  authors: A.G. Bryant\*, A. Jha\*, S. Agarwal, P. Cahill, B. Lam, S.G. Oldham, A. Arnatkeviciute, A. Fornito, B.D. Fulcher
  link:
    url: https://doi.org/10.1162/netn.a.39
    journal: Network Neuroscience
    year: 2025
  highlight: 1
  news2:
  video: https://www.youtube.com/watch?v=f51mzoUYO5Q

- title: Canonical time-series features for characterizing biologically informative dynamical patterns in fMRI
  image: AlamAperture2025.svg
  description: "The comprehensive hctsa library can compute over 7,000 time-series features from fMRI data, but this is computationally costly and statistically unwieldy for routine neuroimaging use. The authors distilled this library down to catchaMouse16, a set of just 16 interpretable features selected for their ability to detect chemogenetic manipulations in mouse fMRI and validated via clustering and cross-validation. Despite a roughly 60-fold speed-up, the reduced feature set still tracks biologically meaningful patterns, such as cortical interneuron density, in independent mouse and human datasets, making large-scale dynamical fMRI analysis far more practical."
  authors: I. Alam, B. Harris, P. Cahill, O. Cliff, M. Markicevic, V. Zerbi, B.D. Fulcher
  link:
    url: https://doi.org/10.52294/001c.140433
    journal: Aperture Neuroscience
    year: 2025
  highlight: 0
  news2:
  video:

- title: Using matrix-product states for time-series machine learning
  image: Moore2025.png
  description: "Machine learning methods for time-series classification and imputation often trade off interpretability for performance, making it hard to understand what a model has actually learned about the data. The authors adapt matrix-product states, a technique from quantum many-body physics, into MPSTime, an algorithm that learns the full joint probability distribution underlying a time-series dataset from a single loss function. Tested on medical, energy, and astronomy datasets, MPSTime matches competitive methods on classification and imputation while remaining interpretable, and the authors release open-source code for the community."
  authors: J.B. Moore, H.P. Stackhouse, B.D. Fulcher, S. Mahmoodian
  link:
    url: https://doi.org/10.1103/61h8-8qr5
    journal: Physical Review Research
    year: 2025
  highlight: 1
  news2:
  video: https://youtu.be/C0dosxVEqGk

- title: Extracting interpretable signatures of whole-brain dynamics through systematic comparison
  image: Bryant_fMRI.png
  description: "Neuroimaging studies of psychiatric disorders typically rely on a handful of manually chosen statistical features of brain activity, risking that more informative properties of the dynamics are overlooked. The authors systematically compared five ways of representing resting-state fMRI dynamics, spanning thousands of univariate features and pairwise interaction statistics, across four disorders including schizophrenia and autism. Simple statistical representations performed surprisingly well, and combining local dynamics with inter-regional coupling gave the most complete disorder signatures, supporting simpler, more interpretable models for clinical classification."
  authors: A.G. Bryant, K. Aquino, L. Parkes, A. Fornito, B.D. Fulcher
  link:
    url: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1012692
    journal: PLOS Computational Biology
    year: 2024
  highlight: 1
  news2:
