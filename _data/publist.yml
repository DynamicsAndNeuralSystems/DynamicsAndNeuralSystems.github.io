- title: Tracking the Distance to Criticality in Systems with Unknown Noise
  image: HarrisCriticality.png
  description: "Many systems undergo dramatic shifts near critical points, but existing methods for detecting this proximity to criticality assume fixed, low-level noise, which breaks down when real-world noise is variable and unknown. The authors compared over 7,000 candidate time-series features for tracking distance to criticality under variable noise, and introduced a new statistic, the Rescaled Auto-Density (RAD), that captures the shape of a system's dynamics relative to its fluctuations. Applied to brain imaging data, RAD provides new evidence that regions higher in the visual hierarchy sit closer to criticality, offering a noise-robust early-warning tool for systems from ecosystems to the brain."
  authors: B. Harris, L. Gollo, B.D. Fulcher
  link:
    url: https://doi.org/10.1103/PhysRevX.14.031021
    journal: Physical Review X
    year: 2024
  highlight: 1
  news2: https://theconversation.com/crashes-blackouts-and-climate-tipping-points-how-can-we-tell-when-a-system-is-close-to-the-edge-236683
  video: https://www.youtube.com/watch/4_rIMEl-pcU

- title: Analyzing the Brain's Dynamic Response to Targeted Stimulation using Generative Modeling
  image: RishiStimulationReview.png
  description: "Generative models have been powerful for explaining spontaneous brain dynamics, but it is unclear whether the same mechanisms can account for how the brain responds when it is deliberately perturbed by targeted stimulation. This review argues, using dynamical-systems concepts, that stimulus-evoked dynamics likely involve distinct mechanisms from spontaneous activity, and surveys the experimental stimulation techniques and physiological, phenomenological, and data-driven models that could be paired to test this. Tightly integrating targeted stimulation experiments with generative modeling offers a route to uncovering mechanisms of brain dynamics that spontaneous-activity studies alone cannot reveal."
  authors: R. Maran, E.J. Müller, B.D. Fulcher
  link:
    url: https://doi.org/10.1162/netn_a_00433
    journal: Network Neuroscience
    year: 2024
  highlight: 0
  news2:

- title: Unifying Pairwise Interactions in Complex Dynamics
  image: CliffPairwise.png
  description: "Scientists have invented hundreds of methods, from correlation to causal inference, to measure interactions between pairs of time series, but these methods rest on disconnected mathematical theories, making it hard to know which to use. The authors assembled a library of 237 pairwise interaction statistics and systematically evaluated them across 1,053 real-world and model-generated multivariate time series, uncovering hidden connections between disparate formulations. Three case studies show that leveraging this diverse, unified library helps identify the most suitable interaction measures for a given problem, backed by open-source software for the wider research community."
  authors: O.M. Cliff, A. Bryant, J.T. Lizier, N. Tsuchiya, B.D. Fulcher
  link:
    url: https://www.nature.com/articles/s43588-023-00519-x
    journal: Nature Computational Science
    year: 2023
  highlight: 0
  news2:

- title: On the information-theoretic formulation of network participation
  image: Pavle_PRE.png
  description: "The participation coefficient is a popular way to measure how diversely a network node connects across communities, but its statistical behaviour and relationship to other diversity measures has not been well understood. The authors reformulate this concept information-theoretically as participation entropy, the Shannon entropy of a node's module-label distribution, connecting it rigorously to established measures in information theory. This unifying formulation clarifies what participation coefficients actually quantify and gives network scientists a firmer theoretical foundation for characterizing integrative, multi-community nodes."
  authors: P. Cajic, D. Agius, O.M. Cliff, J.M. Shine, J.T. Lizier, B.D. Fulcher
  link:
    url: https://doi.org/10.1088/2632-072X/ad32da
    journal: Journal of Physics Complexity
    year: 2024
  highlight: 0
  news2:

- title: "Never a Dull Moment: Distributional Properties as a Baseline for Time-Series Classification"
  image: Henderson_DullMoment.png
  description: "As time-series classification methods have grown increasingly complex, it has been unclear how much of their performance reflects genuine insight into temporal dynamics versus gains that a trivial baseline could achieve. The authors tested a minimal classifier using only the mean and standard deviation of each time series, deliberately ignoring temporal ordering, across 128 real-world classification problems. This dull baseline beat chance on the majority of problems and, in a schizophrenia neuroimaging case study, even outperformed a more complex model with temporal features, arguing that new methods should always be checked against such simple baselines."
  authors: T. Henderson, A.G. Bryant, B.D. Fulcher
  link:
    url: http://arxiv.org/abs/2303.17809
    journal: arXiv
    year: 2022
  highlight: 0
  news2:

- title: Feature-Based Time-Series Analysis in R using the theft Package
  image: HendersonTheft.png
  description: "Time-series feature-extraction tools are scattered across different software packages and programming languages, forcing researchers to learn multiple ecosystems just to compare feature sets. The authors built theft and theftdlc, a pair of R packages that unify six major feature sets, catch22, feasts, tsfeatures, Kats, tsfresh, and TSFEL, behind a single interface with built-in visualization and classification tools. This gives R users one-stop access to thousands of time-series features plus ready-made analysis pipelines, closing a longstanding gap in the open-source time-series toolkit."
  authors: T. Henderson, B.D. Fulcher
  link:
    url: https://doi.org/10.32614/RJ-2025-023
    journal: The R Journal
    year: 2025
  highlight: 1
  news2:

- title: Classifying Kepler light curves for 12,000 A and F stars using supervised feature-based machine learning
  image: BarabaraKepler.png
  description: "Large stellar surveys like Kepler generate huge volumes of light-curve data, but classifying the diverse variability types they contain, such as pulsating and eclipsing stars, has traditionally relied on manually engineered, domain-specific features. The authors instead compared around 7,000 general-purpose time-series features to find those that best separate seven major classes of stellar variability, distilling them into an interpretable five-dimensional feature space. Applied to 12,000 Kepler A- and F-type stars, the approach reached 82% balanced classification accuracy, showing that data-driven, interpretable features can rival bespoke astronomical pipelines."
  authors: N.H. Barbara, T.R. Bedding, B.D. Fulcher, S.J. Murphy, T. Van Reeth
  link:
    url: https://doi.org/10.1093/mnras/stac1515
    journal: Monthly Notices of the Royal Astronomical Society
    year: 2022
  highlight: 0
  news2:

- title: Extracting dynamical understanding from neural-mass models of mouse cortex
  image: SiuFrontiers.png
  description: "New brain atlases reveal detailed cell-density variation across the cortex, but it has remained unclear how such microscale physiology shapes the macroscale dynamics seen in neuroimaging. The authors built a neural-mass model of 37 mouse cortical regions, incorporating measured cell-density maps into the model's coupling parameters, and used bifurcation analysis to interpret each region's dynamical regime. Surprisingly, strong fits to resting-state fMRI emerged even when all regions sat at stable fixed points, showing that a region's sensitivity to its inputs, not complex intrinsic dynamics, drives realistic whole-brain activity patterns."
  authors: P.H. Siu, E. Müller, V. Zerbi, K. Aquino, B.D. Fulcher
  link:
    url: https://doi.org/10.3389/fncom.2022.847336
    journal: Frontiers in Computational Neuroscience
    year: 2022
  highlight: 0
  news2:

- title: Overcoming false-positive gene-category enrichment in the analysis of spatially resolved transcriptomic brain atlas data
  image: FulcherFalsePositive.png
  description: "Gene-category enrichment analysis is routinely applied to spatial transcriptomic brain atlas data, but standard methods were not designed for the strong spatial autocorrelation and gene-gene coexpression such data contain. The authors show that conventional enrichment analysis is severely biased, inflating false-positive associations more than 500-fold on average, and develop a flexible ensemble-based null model that accounts for these confounds. The bias is severe enough that a gene category's estimated false-positive rate predicts how often it gets reported as significant in the published literature, and the authors release an open-source toolbox to help others avoid the same pitfall."
  authors: B.D. Fulcher, A. Arnatkeviciute, A. Fornito
  link:
    url: https://doi.org/10.1038/s41467-021-22862-1
    journal: Nature Communications
    year: 2021
  highlight: 0
  news2:

- title: Scaling of gene transcriptional gradients with brain size across mouse development
  image: LauNeuroImage.png
  description: "Gene expression varies smoothly across the brain, but how this spatial organization changes as the brain grows during development has been unclear. Using expression data for over 1,800 genes across seven developmental time points from the Allen Developing Mouse Brain Atlas, the authors measured how transcriptional similarity decays with distance at each stage. They found this decay follows a consistent power-law relationship with brain size, and captured it with a simple growth model of expanding spatially autocorrelated gradients, offering a quantitative account of how molecular organization scales with brain development."
  authors: H.Y. Gladys Lau, A. Fornito, B.D. Fulcher
  link:
    url: https://doi.org/10.1016/j.neuroimage.2020.117395
    journal: NeuroImage
    year: 2021
  highlight: 0
  news2:

- title: Timescales of spontaneous fMRI fluctuations relate to structural connectivity in the brain
  image: FallonNetworkNeurosci.png
  description: "Different brain regions exhibit characteristically different timescales of spontaneous activity, but it has been unclear how this temporal hierarchy relates to the brain's underlying wiring. Using resting-state fMRI and diffusion MRI from 100 Human Connectome Project participants, the authors related each region's intrinsic activity timescale to its structural connectivity properties. The results tie together the temporal and structural organization of the brain, offering new insight into how the wiring diagram shapes the pace of information processing across regions."
  authors: J. Fallon, P. Ward, L. Parkes, S. Oldham, A. Arnatkeviciute, A. Fornito, B.D. Fulcher
  link:
    url: https://doi.org/10.1162/netn_a_00151
    journal: Network Neuroscience
    year: 2020
  highlight: 0
  news2:

- title: A self-organizing, living library of time-series data
  image: CompEngine.png
  description: "Time-series data and analysis methods are developed independently across many scientific fields and industry, limiting the cross-disciplinary connections that could come from noticing similar dynamics in different domains. CompEngine is a web platform that places any uploaded time series into a common, feature-based space alongside over 24,000 existing recordings, from birdsong to finance, letting users instantly find data with similar dynamical structure. By connecting datasets on the basis of their empirical structure rather than metadata or discipline, CompEngine lowers the barrier to interdisciplinary discovery and incentivizes broader sharing of time-series data."
  authors: B.D. Fulcher, C.H. Lubba, S.S. Sethi, N.S. Jones
  link:
    url: https://doi.org/10.1038/s41597-020-0553-0
    journal: Scientific Data
    year: 2020
  highlight: 0
  news2:

- title: Multimodal gradients across mouse cortex
  image: FulcherPNAS2019.png
  description: "The primate cortex is known to have a hierarchical gradient running from sensory to association areas, but whether this is a uniquely primate feature or a more general principle of mammalian brain organization was unknown. The authors mapped large-scale gradients in cytoarchitecture, gene expression, interneuron density, and long-range connectivity across mouse cortex, using MRI-based tissue contrast as a common reference for comparison with primates. Finding consistent hierarchical gradients in the mouse reveals an underappreciated spatial dimension of rodent cortical organization and supports a conserved mammalian principle linking microcircuit structure to macroscale brain hierarchy."
  authors: B.D. Fulcher, J.D. Murray, V. Zerbi, X.-J. Wang
  link:
    url: https://doi.org/10.1073/pnas.1814144116
    journal: PNAS
    year: 2019
  highlight: 0
  news2:

- title: "_catch22_: CAnonical Time-series CHaracteristics"
  image: LubbaCatch22.png
  description: "The comprehensive hctsa library can compute thousands of interpretable time-series features, but its size makes it computationally expensive and redundant for everyday classification tasks. The authors developed a method to distil this library down to a minimal, non-redundant, high-performing feature set, tested across 93 datasets spanning more than 147,000 time series. The resulting catch22 set of 22 features cuts computation time roughly 1000-fold while sacrificing only about 7% classification accuracy, making feature-based time-series analysis practical at scale."
  authors: C.H. Lubba, S.S. Sethi, P. Knaute, S.R. Schultz, N.S. Jones, B.D. Fulcher
  link:
    url: https://doi.org/10.1007/s10618-019-00647-x
    journal: Data Mining and Knowledge Discovery
    year: 2019
  highlight: 0
  news2:

- title: Structural connectome topology relates to regional BOLD signal dynamics in the mouse brain
  image: SethiChaos.png
  description: "Structural brain connectivity is known to shape correlated activity between pairs of brain regions, but whether it also relates to the intrinsic dynamics of individual regions on their own was unclear. Using a directed mesoscale mouse connectome and resting-state fMRI from eighteen anesthetized mice, the authors related each region's local network properties, such as degree, betweenness, and clustering, to its own BOLD signal dynamics. The findings show that a region's place in the structural network is linked to its intrinsic activity, extending the connectome's influence beyond pairwise functional connectivity to the dynamics of single brain areas."
  authors: S.S. Sethi, V. Zerbi, N. Wenderoth, A. Fornito, B.D. Fulcher
  link:
    url: https://doi.org/10.1063/1.4979281
    journal: Chaos
    year: 2017
