# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Dynamics and Neural Systems Group
email: ben.fulcher@sydney.edu.au
description: > # this means to ignore newlines until "baseurl:"
  This is a website for our Dynamics and Neural Systems research group
  led by Ben Fulcher at the University of Sydney.
baseurl: ""
url: "https://dynamicsandneuralsystems.github.io"
image: /images/slider/GroupPhoto_May2026.jpeg

# Easter eggs - toggle off to disable without deleting the code (team.md,
# member_card.html, alumni_card.html).
captcha_easter_egg: false

include:
  - .htaccess
  - _pages

plugins:
  - jekyll-sitemap

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
